# Production compose for the D2D EC2 box.
# Differs from docker-compose.yml in two ways: no local Postgres (DATABASE_URL points
# at the managed cloud instance) and the image comes from GHCR rather than a local build.
# CI writes this file plus .env into /opt/d2d and runs `docker compose -f ... up -d`.
services:
  api:
    # Pinned to the commit SHA by CI (see .env) so a deploy is immutable and rollback
    # is just re-running an older workflow.
    image: ${IMAGE:-ghcr.io/sanjoyt2/aipm-test:latest}
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Production compose for the D2D EC2 box.
# Caddy handles HTTPS automatically (Let's Encrypt). The app is internal-only.
# CI writes this file + Caddyfile + .env into /opt/d2d and runs docker compose up -d.
services:
  api:
    image: ${IMAGE:-ghcr.io/sanjoyt2/aipm-test:latest}
    restart: always
    # No host port — Caddy is the only entry point.
    expose:
      - "8000"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:   {}   # persists TLS certificates across restarts
  caddy_config: {}

name: Ops — try 11za template creation API

# Experimental, manual: the public 11za collection documents only template READS,
# but webhook add/delete exist — so template-create endpoints may exist undocumented.
# Tries the plausible route names with a well-formed signup_otp payload. Success
# creates exactly the template we need; unknown routes just error.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Iterate payload shapes against /apis/template/create
        env:
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_ORIGIN_WEBSITE: ${{ secrets.WA_ORIGIN_WEBSITE }}
        run: |
          BODY_TEXT="{{1}} is your Degree2Destiny verification code. It expires in 10 minutes."
          INNER="{\"name\":\"signup_otp\",\"category\":\"AUTHENTICATION\",\"language\":\"en\",\"components\":[{\"type\":\"BODY\",\"text\":\"${BODY_TEXT}\",\"example\":{\"texts\":[\"482913\"]}}]}"
          AUTH="\"authToken\":\"${WA_API_TOKEN}\",\"originWebsite\":\"${WA_ORIGIN_WEBSITE}\""

          # The working shape is {"template": {...}} — "name already exist" for
          # signup_otp proved it parses and validates. Now create a genuinely new
          # template (day-2 nudge from whatsapp-templates.yaml) to confirm end-to-end.
          NUDGE="{\"name\":\"nudge_day2\",\"category\":\"UTILITY\",\"language\":\"en\",\"components\":[{\"type\":\"BODY\",\"text\":\"{{1}}, we have missed you for 2 days. 10-minute lesson today? Reply START to continue.\",\"example\":{\"texts\":[\"Priya\"]}}]}"
          echo "==== create nudge_day2 ===="
          curl -sS -o /tmp/resp -w "HTTP %{http_code}\n" -X POST "https://api.11za.in/apis/template/create" \
            -H "Content-Type: application/json" -d "{${AUTH},\"template\":${NUDGE}}" || true
          head -c 600 /tmp/resp; echo
          echo "==== re-check signup_otp name (expect: already exist) ===="
          curl -sS -o /tmp/resp -w "HTTP %{http_code}\n" -X POST "https://api.11za.in/apis/template/create" \
            -H "Content-Type: application/json" -d "{${AUTH},\"template\":${INNER}}" || true
          head -c 600 /tmp/resp; echo
          echo "==== catalog after probes ===="
          curl -sS -X POST "https://api.11za.in/apis/template/getTemplates" \
            -H "Content-Type: application/json" \
            -d "{${AUTH},\"limit\":10,\"page\":1,\"search\":\"\"}" \
            | head -c 1500; echo

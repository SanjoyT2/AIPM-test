name: Ops — try 11za template creation API

# Experimental, manual: the public 11za collection documents only template READS,
# but webhook add/delete exist — so template-create endpoints may exist undocumented.
# Tries the plausible route names with a well-formed signup_otp payload. Success
# creates exactly the template we need; unknown routes just error.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Iterate payload shapes against /apis/template/create
        env:
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_ORIGIN_WEBSITE: ${{ secrets.WA_ORIGIN_WEBSITE }}
        run: |
          BODY_TEXT="{{1}} is your Degree2Destiny verification code. It expires in 10 minutes."
          INNER="{\"name\":\"signup_otp\",\"category\":\"AUTHENTICATION\",\"language\":\"en\",\"components\":[{\"type\":\"BODY\",\"text\":\"${BODY_TEXT}\",\"example\":{\"texts\":[\"482913\"]}}]}"
          AUTH="\"authToken\":\"${WA_API_TOKEN}\",\"originWebsite\":\"${WA_ORIGIN_WEBSITE}\""

          # Working contract: {template: {name, category, localizations:[{language,
          # components:[{type:BODY,text,example}]}]}}. Create the whole proactive
          # fleet from whatsapp-templates.yaml ("already exist" = fine, idempotent).
          create() { # name category body example1 [example2]
            local EX="[\"$4\"]"; if [ -n "$5" ]; then EX="[\"$4\",\"$5\"]"; fi
            local T="{\"name\":\"$1\",\"category\":\"$2\",\"localizations\":[{\"language\":\"en\",\"components\":[{\"type\":\"BODY\",\"text\":\"$3\",\"example\":{\"texts\":${EX}}}]}]}"
            echo "==== create $1 ===="
            curl -sS -o /tmp/resp -w "HTTP %{http_code}\n" -X POST "https://api.11za.in/apis/template/create" \
              -H "Content-Type: application/json" -d "{${AUTH},\"template\":${T}}" || true
            head -c 400 /tmp/resp; echo
          }
          create nudge_day3_streak UTILITY "Your streak was {{1}} days. Come back - one lesson restarts it. Reply START." "5"
          create warning_day5 UTILITY "{{1}}, it has been 5 days. The 90-day clock is running - take today's lesson to protect your progress. Reply START." "Priya"
          create gate_reminder UTILITY "Your {{1}} gate is tomorrow (Saturday). Reply PREP to get ready." "Level 1"
          create milestone_levelup UTILITY "Congratulations {{1}}! You cleared {{2}}. The next level is ready - reply START." "Priya" "Level 1"
          create weekly_checkin UTILITY "{{1}}, time for your weekly check-in. How is your project going? Reply UPDATE to share your progress." "Priya"
          create signup_otp AUTHENTICATION "${BODY_TEXT}" "482913"
          echo "==== catalog after probes ===="
          curl -sS -X POST "https://api.11za.in/apis/template/getTemplates" \
            -H "Content-Type: application/json" \
            -d "{${AUTH},\"limit\":10,\"page\":1,\"search\":\"\"}" \
            | head -c 1500; echo

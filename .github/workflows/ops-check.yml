name: Ops — onboarding status

# Manual, read-only operational probe: forces the Onboarding agent to re-discover
# the 11za template catalog and prints what it resolved. The response contains
# template names/statuses only — no secrets, no learner PII.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh + print onboarding status
        env:
          OPERATOR_KEY: ${{ secrets.OPERATOR_KEY }}
        run: |
          curl -fsS -X POST -H "x-operator-key: ${OPERATOR_KEY}" \
            https://d2d.college2career.app/api/onboarding/refresh | python3 -m json.tool

      # Token sanity: call 11za's template-list endpoint directly. Prints only the
      # response body (template names / an error message) — never the token itself.
      - name: Probe 11za directly with WA_API_TOKEN
        env:
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_ORIGIN_WEBSITE: ${{ secrets.WA_ORIGIN_WEBSITE }}
        run: |
          for ep in getTemplates getTemplatesAll getTemp; do
            echo "==== $ep ===="
            curl -sS -X POST "https://api.11za.in/apis/template/${ep}" \
              -H "Content-Type: application/json" \
              -d "{\"authToken\":\"${WA_API_TOKEN}\",\"originWebsite\":\"${WA_ORIGIN_WEBSITE}\",\"limit\":10,\"page\":1,\"search\":\"\"}" \
              | head -c 3000; echo
          done
          echo "==== inbound webhook (current config, read-only) ===="
          curl -sS -X POST "https://api.11za.in/apis/inboundwebhook/get" \
            -H "Content-Type: application/json" \
            -d "{\"authToken\":\"${WA_API_TOKEN}\",\"originWebsite\":\"${WA_ORIGIN_WEBSITE}\"}" \
            | head -c 2000; echo

      - name: Template fleet status (approved / pending / submitted)
        env:
          OPERATOR_KEY: ${{ secrets.OPERATOR_KEY }}
        run: |
          curl -fsS -H "x-operator-key: ${OPERATOR_KEY}" \
            https://d2d.college2career.app/api/templates/status | python3 -m json.tool
